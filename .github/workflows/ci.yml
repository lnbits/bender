name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust, installer, and deterministic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features --locked

      - name: Deterministic orchestration fixture
        run: cargo test --locked orchestrator::tests::deterministic_subprocess_repair_lifecycle -- --exact

      - name: Installer tests
        run: ./scripts/test-installer.sh

      - name: Optional project checks
        run: ./scripts/ci-project-checks.sh

      - name: Playwright evidence fixture
        run: ./scripts/test-playwright-fixture.sh

      - name: Release build
        run: cargo build --release --locked

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            target/nextest/
            target/debug/deps/*.log
            .bender/jobs/*/artifacts/
            tests/fixtures/playwright/proof/
          if-no-files-found: ignore
          retention-days: 7
