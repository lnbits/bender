name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Tag matches Cargo version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bender") | .version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version v${package_version}" >&2
            exit 1
          }

      - name: Full release validation
        run: ./scripts/validate-release.sh

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: bender-linux-x86_64
            binary: bender
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: bender-linux-aarch64
            binary: bender
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: bender-macos-x86_64
            binary: bender
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: bender-macos-aarch64
            binary: bender
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: bender-windows-x86_64.exe
            binary: bender.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage installer-compatible asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload platform asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Verify release asset set
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        run: ./scripts/verify-release-assets.sh dist --generate

      - name: Upload complete release set
        uses: actions/upload-artifact@v4
        with:
          name: bender-release-assets
          path: |
            dist/bender-linux-x86_64
            dist/bender-linux-aarch64
            dist/bender-macos-x86_64
            dist/bender-macos-aarch64
            dist/bender-windows-x86_64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@v4
        with:
          name: bender-release-assets
          path: dist

      - name: Publish only the complete verified set
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/bender-linux-x86_64
            dist/bender-linux-aarch64
            dist/bender-macos-x86_64
            dist/bender-macos-aarch64
            dist/bender-windows-x86_64.exe
            dist/SHA256SUMS
