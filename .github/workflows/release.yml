name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/bender dist/bender-linux-x86_64
          tar -C dist -czf dist/bender-linux-x86_64.tar.gz bender-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/bender.exe dist/bender-windows-x86_64.exe
          Compress-Archive -Path dist/bender-windows-x86_64.exe -DestinationPath dist/bender-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist dmg-root
          cp target/${{ matrix.target }}/release/bender dist/bender-${{ matrix.suffix }}
          cp dist/bender-${{ matrix.suffix }} dmg-root/bender
          cp README.md dmg-root/README.md
          hdiutil create -volname "Bender" -srcfolder dmg-root -ov -format UDZO dist/Bender-${{ matrix.suffix }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --release --locked

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          mkdir -p dist
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/io.github.bender.Bender.yml
          flatpak build-bundle flatpak-repo dist/Bender-linux-x86_64.flatpak io.github.bender.Bender

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  publish:
    name: Attach release assets
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
      - flatpak
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
