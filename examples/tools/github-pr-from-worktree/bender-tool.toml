name = "github-pr-from-worktree"
version = "0.1.0"
description = "Create a branch, commit the current worktree, push it, and open a draft GitHub PR. Forgiving input: if branch, commit_message, title, or body are omitted, the tool infers safe defaults from git status. For a normal PR after editing files, call with {\"intent\":\"create_pr\"} or {\"summary\":\"short change summary\"}."
command = "./run.py"
requires_confirmation = true

permissions = [
  "git:branch",
  "git:add",
  "git:commit",
  "git:push",
  "network:github.com",
  "command:gh",
]

[input_schema]
type = "object"

[input_schema.properties.branch]
type = "string"
description = "Optional feature branch name to create or use. If omitted, inferred as bender/<date>-<slug>."

[input_schema.properties.commit_message]
type = "string"
description = "Optional git commit message. If omitted, inferred from title/summary or changed files."

[input_schema.properties.title]
type = "string"
description = "Optional pull request title. If omitted, inferred from summary/intent or changed files."

[input_schema.properties.body]
type = "string"
description = "Optional pull request body. If omitted, includes title and changed files."

[input_schema.properties.intent]
type = "string"
description = "Optional high-level intent. Use create_pr for the common case where Bender has already edited files and should make a PR."

[input_schema.properties.summary]
type = "string"
description = "Optional short human summary used to infer branch, commit message, and PR title."

[input_schema.properties.base]
type = "string"
description = "Base branch. Defaults to main."

[input_schema.properties.draft]
type = "boolean"
description = "Create the pull request as a draft. Defaults to true."

[input_schema.properties.dry_run]
type = "boolean"
description = "Return the commands that would run without executing them."

[output_schema]
type = "object"
required = ["ok"]
