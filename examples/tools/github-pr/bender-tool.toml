name = "github-pr"
version = "0.1.0"
description = "Create a GitHub pull request for the current git branch using the GitHub CLI."
command = "./run.py"
requires_confirmation = true

permissions = [
  "git:read",
  "network:github.com",
  "command:gh",
]

[input_schema]
type = "object"
required = ["title", "body"]

[input_schema.properties.title]
type = "string"
description = "Pull request title."

[input_schema.properties.body]
type = "string"
description = "Pull request body."

[input_schema.properties.base]
type = "string"
description = "Base branch. Defaults to main."

[input_schema.properties.draft]
type = "boolean"
description = "Create the pull request as a draft. Defaults to true."

[input_schema.properties.push]
type = "boolean"
description = "Push the current branch before creating the pull request. Defaults to false."

[input_schema.properties.dry_run]
type = "boolean"
description = "Return the commands that would run without executing them."

[output_schema]
type = "object"
required = ["ok"]
